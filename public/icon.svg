<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#gradBg)" stroke="#1E293B" stroke-width="8" />

  <!-- Orbit Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Life Tree / Compass Core -->
  <g filter="url(#shadow)">
    <!-- Central Hexagonal Ring -->
    <path d="M256 120 L370 186 L370 326 L256 392 L142 326 L142 186 Z" fill="none" stroke="url(#gradGlow)" stroke-width="14" stroke-linejoin="round" />
    
    <!-- Inner Sprout / Growth Symbol -->
    <path d="M256 350 C256 280 200 240 200 190 C200 150 230 130 256 130 C282 130 312 150 312 190 C312 240 256 280 256 350 Z" fill="url(#gradGlow)" opacity="0.9" />
    
    <!-- Central Node -->
    <circle cx="256" cy="256" r="18" fill="#FFFFFF" />
    
    <!-- Dynamic Pulse Dots -->
    <circle cx="256" cy="120" r="8" fill="#10B981" />
    <circle cx="370" cy="186" r="8" fill="#06B6D4" />
    <circle cx="370" cy="326" r="8" fill="#3B82F6" />
    <circle cx="256" cy="392" r="8" fill="#10B981" />
    <circle cx="142" cy="326" r="8" fill="#06B6D4" />
    <circle cx="142" cy="186" r="8" fill="#3B82F6" />
  </g>
</svg>
